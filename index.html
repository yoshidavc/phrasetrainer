n": "Can you repeat the question, please?", "ja": "質問をもう一度言っていただけますか？"}, {"en": "Can you repeat your email address?", "ja": "メールアドレスをもう一度言ってもらえますか？"}, {"en": "The connection is bad. Can you repeat what you just said?", "ja": "回線が悪いです。今言ったことをもう一度お願いできますか？"}]}, {"p": "Can you elaborate", "ja": "詳しく説明してもらえますか", "c": "confirm", "t": "pattern", "u": "used alone, or + on + noun", "ex": [{"en": "Can you elaborate on that point?", "ja": "その点について詳しく説明してもらえますか？"}, {"en": "That's interesting. Can you elaborate?", "ja": "興味深いですね。詳しく聞かせてもらえますか？"}, {"en": "Can you elaborate on how the new system works?", "ja": "新しいシステムの仕組みを詳しく説明してもらえますか？"}, {"en": "Can you elaborate a little on the risks?", "ja": "リスクについてもう少し詳しく説明してもらえますか？"}, {"en": "Can you elaborate on your plan for next year?", "ja": "来年の計画について詳しく教えてもらえますか？"}]}, {"p": "Correct me if I'm wrong", "ja": "間違っていたら訂正してください", "c": "confirm", "t": "pattern", "u": "sentence opener, usually followed by ', but' + a complete clause", "ex": [{"en": "Correct me if I'm wrong, but the meeting starts at three, right?", "ja": "間違っていたら言ってください、会議は3時からですよね？"}, {"en": "Correct me if I'm wrong, but I think we agreed on a lower price.", "ja": "違っていたら訂正してほしいのですが、もっと安い価格で合意したと思います。"}, {"en": "Correct me if I'm wrong, but this data is from last year.", "ja": "間違っていたらすみません、このデータは昨年のものですよね。"}, {"en": "Correct me if I'm wrong, but you've been to Kyoto before, haven't you?", "ja": "違っていたらごめん、京都に行ったことあるよね？"}, {"en": "Correct me if I'm wrong, but the deadline was moved to Monday.", "ja": "間違っていたら訂正してください、締め切りは月曜に変更になったはずです。"}]}, {"p": "In conclusion", "ja": "結論として", "c": "conclude", "t": "opener", "u": "sentence-initial connector + comma + complete clause; never a noun", "ex": [{"en": "In conclusion, the new method is both faster and cheaper.", "ja": "結論として、新しい手法はより速く、より安価です。"}, {"en": "In conclusion, I'd like to thank everyone for their hard work.", "ja": "最後に、皆さんのご尽力に感謝申し上げます。"}, {"en": "In conclusion, our survey shows that customers want simpler products.", "ja": "結論として、調査から顧客はよりシンプルな製品を求めていることが分かります。"}, {"en": "In conclusion, we should focus on the Asian market next year.", "ja": "結論として、来年はアジア市場に注力すべきです。"}, {"en": "In conclusion, regular exercise clearly improves sleep quality.", "ja": "結論として、定期的な運動は明らかに睡眠の質を改善します。"}]}, {"p": "I have 3 points", "ja": "3点あります", "c": "conclude", "t": "pattern", "u": "announces three points in a talk; keep the digit 3", "ex": [{"en": "I have 3 points I'd like to make today.", "ja": "今日は3点お話ししたいと思います。"}, {"en": "I have 3 points to share. First, our sales are up.", "ja": "3点共有します。まず、売上が伸びています。"}, {"en": "Regarding this proposal, I have 3 points.", "ja": "この提案について、3点あります。"}, {"en": "I have 3 points, so I'll keep it brief.", "ja": "3点ありますので、手短にお話しします。"}, {"en": "I have 3 points about the schedule, the budget and the staff.", "ja": "スケジュール、予算、人員について3点あります。"}]}, {"p": "Let me summarize", "ja": "まとめさせてください", "c": "conclude", "t": "pattern", "u": "used alone, or + noun / what-clause", "ex": [{"en": "Let me summarize what we've discussed so far.", "ja": "ここまでの議論をまとめさせてください。"}, {"en": "Let me summarize the key points before we finish.", "ja": "終わる前に要点をまとめさせてください。"}, {"en": "Okay, let me summarize. We'll launch in May with a smaller budget.", "ja": "では、まとめます。予算を抑えて5月にローンチします。"}, {"en": "Let me summarize the results of the survey.", "ja": "調査結果をまとめさせてください。"}, {"en": "Let me summarize the main differences between the two plans.", "ja": "2つのプランの主な違いをまとめさせてください。"}]}, {"p": "Could I ask a basic question?", "ja": "基本的な質問をしてもいいですか", "c": "ask", "t": "closer", "u": "a polite standalone question, usually followed by the actual question", "ex": [{"en": "Could I ask a basic question? What does KPI stand for?", "ja": "基本的な質問をしてもいいですか？KPIは何の略ですか？"}, {"en": "Sorry, could I ask a basic question about the process?", "ja": "すみません、手順について基本的な質問をしてもいいですか？"}, {"en": "Before we go further, could I ask a basic question?", "ja": "先に進む前に、基本的な質問をしてもいいですか？"}, {"en": "Could I ask a basic question? Who is our main customer?", "ja": "基本的な質問をしてもいいですか？主な顧客は誰ですか？"}, {"en": "I'm new to this field. Could I ask a basic question?", "ja": "この分野は初めてなのですが、基本的な質問をしてもいいですか？"}]}, {"p": "Maybe this is a stupid question, but", "ja": "馬鹿な質問かもしれませんが", "c": "ask", "t": "pattern", "u": "humble opener followed directly by the actual question", "ex": [{"en": "Maybe this is a stupid question, but why do we need two servers?", "ja": "馬鹿な質問かもしれませんが、なぜサーバーが2台必要なのですか？"}, {"en": "Maybe this is a stupid question, but what does 'ROI' mean?", "ja": "くだらない質問かもしれませんが、「ROI」とはどういう意味ですか？"}, {"en": "Maybe this is a stupid question, but is the office open on Saturdays?", "ja": "馬鹿な質問かもしれませんが、オフィスは土曜日も開いていますか？"}, {"en": "Maybe this is a stupid question, but how do I turn this on?", "ja": "初歩的な質問かもしれませんが、これはどうやって電源を入れるんですか？"}, {"en": "Maybe this is a stupid question, but can we just ask the customer?", "ja": "馬鹿な質問かもしれませんが、顧客に直接聞けばいいのでは？"}]}, {"p": "Could you educate me", "ja": "〜について教えていただけますか", "c": "ask", "t": "pattern", "u": "used alone, or + on + noun / how-clause; a humble request to learn", "ex": [{"en": "Could you educate me on how this tool works?", "ja": "このツールの仕組みを教えていただけますか？"}, {"en": "Could you educate me on the basics of investing?", "ja": "投資の基本を教えていただけますか？"}, {"en": "I'm not familiar with this market. Could you educate me?", "ja": "この市場には詳しくないので、教えていただけますか？"}, {"en": "Could you educate me on the history of this project?", "ja": "このプロジェクトの経緯を教えていただけますか？"}, {"en": "Could you educate me on the difference between these two models?", "ja": "この2つのモデルの違いを教えていただけますか？"}]}, {"p": "I've got to", "ja": "〜しなきゃ", "c": "topic", "t": "stem_vp_self", "u": "+ bare verb; casual 'have to'", "ex": [{"en": "I've got to go. See you tomorrow!", "ja": "もう行かなきゃ。また明日！"}, {"en": "I've got to finish this report by noon.", "ja": "昼までにこのレポートを終わらせなきゃ。"}, {"en": "I've got to admit, your idea is better than mine.", "ja": "正直、君のアイデアの方が僕のより良いと認めざるを得ないね。"}, {"en": "I've got to pick up my kids at five.", "ja": "5時に子どもを迎えに行かなきゃ。"}, {"en": "I've got to remember to call my mom tonight.", "ja": "今夜お母さんに電話するのを忘れないようにしなきゃ。"}]}, {"p": "Next time I do", "ja": "次に〜するときは", "c": "thanks", "t": "pattern", "u": "'Next time I do + object, + main clause (usually I'll ...)'", "ex": [{"en": "Next time I do this, I'll ask for help earlier.", "ja": "次にこれをやるときは、もっと早く助けを求めるよ。"}, {"en": "Next time I do a presentation, I'll practice more.", "ja": "次にプレゼンをするときは、もっと練習します。"}, {"en": "Next time I do the shopping, I'll make a list first.", "ja": "次に買い物をするときは、先にリストを作ろう。"}, {"en": "Next time I do business in Tokyo, let's have dinner.", "ja": "次に東京で仕事をするときは、夕食に行きましょう。"}, {"en": "Next time I do the report, I'll double-check the data.", "ja": "次にレポートを作るときは、データを二重チェックします。"}]}, {"p": "Be careful 〜ing", "ja": "〜するときは気をつけて", "c": "request", "t": "pattern", "u": "Be careful + -ing verb (e.g. Be careful crossing the street)", "ex": [{"en": "Be careful crossing the street.", "ja": "道を渡るときは気をつけてね。"}, {"en": "Be careful driving in the snow.", "ja": "雪の中を運転するときは気をつけて。"}, {"en": "Be careful using that knife. It's really sharp.", "ja": "そのナイフを使うときは気をつけて。すごく切れるよ。"}, {"en": "Be careful walking on the ice.", "ja": "氷の上を歩くときは注意してね。"}, {"en": "Be careful carrying those boxes down the stairs.", "ja": "その箱を持って階段を下りるときは気をつけて。"}]}, {"p": "The more I 〜, the more I 〜", "ja": "〜すればするほど、ますます〜", "c": "opinion", "t": "pattern", "u": "The more I + verb, the more I + verb (comparative correlative)", "ex": [{"en": "The more I practice, the more I enjoy playing the piano.", "ja": "練習すればするほど、ピアノを弾くのが楽しくなる。"}, {"en": "The more I learn about history, the more I want to travel.", "ja": "歴史を学べば学ぶほど、旅行したくなる。"}, {"en": "The more I think about it, the more I like the idea.", "ja": "考えれば考えるほど、そのアイデアが好きになる。"}, {"en": "The more I read, the more I realize how little I know.", "ja": "読めば読むほど、自分がいかに無知か気づかされる。"}, {"en": "The more I work with her, the more I respect her.", "ja": "彼女と働けば働くほど、尊敬の念が強くなる。"}]}, {"p": "I'll let you know if", "ja": "もし〜なら知らせます", "c": "consensus", "t": "stem_if", "u": "+ complete clause describing a possible event", "ex": [{"en": "I'll let you know if anything changes.", "ja": "何か変わったらお知らせします。"}, {"en": "I'll let you know if I need any help.", "ja": "手伝いが必要なら知らせるね。"}, {"en": "I'll let you know if the client replies today.", "ja": "今日クライアントから返事があればお知らせします。"}, {"en": "I'll let you know if I can make it to the party.", "ja": "パーティーに行けるかどうか連絡するね。"}, {"en": "I'll let you know if there are any problems with the order.", "ja": "注文に問題があればご連絡します。"}]}, {"p": "Kind of", "ja": "ちょっと・なんとなく", "c": "opinion", "t": "pattern", "u": "informal hedge before an adjective or verb (It's kind of cold), or a one-word reply; NOT 'a kind of' meaning a type", "ex": [{"en": "It's kind of cold today, isn't it?", "ja": "今日はちょっと寒いよね。"}, {"en": "I'm kind of tired, so I'll stay home tonight.", "ja": "なんだか疲れてるから、今夜は家にいるよ。"}, {"en": "The movie was kind of boring, to be honest.", "ja": "正直、その映画はちょっと退屈だった。"}, {"en": "I kind of like the old design better.", "ja": "前のデザインの方がなんとなく好きかな。"}, {"en": "A: Are you busy?\nB: Kind of. What's up?", "ja": "A: 忙しい？\nB: まあね。どうしたの？"}]}, {"p": "What 〜 for?", "ja": "何のために〜？", "c": "ask", "t": "pattern", "u": "What + auxiliary + subject + verb + for? (asks about purpose)", "ex": [{"en": "What did you do that for?", "ja": "何のためにそんなことをしたの？"}, {"en": "What is this button for?", "ja": "このボタンは何のためのもの？"}, {"en": "What do you need the money for?", "ja": "そのお金は何に使うの？"}, {"en": "What are you saving up for?", "ja": "何のために貯金してるの？"}, {"en": "What did he call you for?", "ja": "彼は何の用で電話してきたの？"}]}, {"p": "I'm not a fan of", "ja": "〜はあまり好きじゃない", "c": "opinion", "t": "ing", "u": "+ noun or -ing; a soft way to say you don't like something", "ex": [{"en": "I'm not a fan of spicy food.", "ja": "辛い食べ物はあまり得意じゃない。"}, {"en": "I'm not a fan of long meetings.", "ja": "長い会議はあまり好きではありません。"}, {"en": "To be honest, I'm not a fan of this color.", "ja": "正直、この色はあまり好みじゃないな。"}, {"en": "I'm not a fan of working late, but it's necessary this week.", "ja": "残業は好きじゃないけど、今週は仕方ない。"}, {"en": "I'm not a fan of horror movies, so let's watch a comedy.", "ja": "ホラー映画は苦手だから、コメディを観ようよ。"}]}, {"p": "Do you have any idea", "ja": "〜って分かりますか？", "c": "ask", "t": "stem_q", "u": "+ wh-clause or if-clause in statement word order; ends with a question mark", "ex": [{"en": "Do you have any idea where my keys are?", "ja": "私の鍵がどこにあるか分かる？"}, {"en": "Do you have any idea how much this costs?", "ja": "これがいくらするか分かりますか？"}, {"en": "Do you have any idea what time it is?", "ja": "今何時か分かってる？"}, {"en": "Do you have any idea why the server went down?", "ja": "なぜサーバーが落ちたか心当たりはありますか？"}, {"en": "Do you have any idea if the store is open on Sunday?", "ja": "お店が日曜に開いているか分かりますか？"}]}, {"p": "Let's say", "ja": "例えば〜としましょう", "c": "consensus", "t": "stem_that", "u": "+ hypothetical complete clause (Let's say we launch in May)", "ex": [{"en": "Let's say we launch the product in May. What happens then?", "ja": "仮に5月に製品を発売するとしましょう。そうするとどうなりますか？"}, {"en": "Let's say you have ten thousand yen. What would you buy?", "ja": "例えば1万円持っているとしたら、何を買う？"}, {"en": "Let's say the meeting takes two hours. We'll finish at five.", "ja": "会議が2時間かかるとしましょう。5時に終わります。"}, {"en": "Let's say we cut the budget by ten percent.", "ja": "仮に予算を10%削減するとしましょう。"}, {"en": "Let's say it rains tomorrow. Do we have a backup plan?", "ja": "明日雨が降ったとしましょう。代わりの計画はありますか？"}]}, {"p": "How does that sound?", "ja": "それでどうですか？（提案への反応を聞く）", "c": "consensus", "t": "closer", "u": "asked right after making a suggestion", "ex": [{"en": "Let's meet at the station at six. How does that sound?", "ja": "6時に駅で待ち合わせよう。どうかな？"}, {"en": "We could start the project next Monday. How does that sound?", "ja": "来週の月曜からプロジェクトを始められます。いかがですか？"}, {"en": "How does that sound to you?", "ja": "それについてどう思いますか？"}, {"en": "I'll send the draft tonight, and you can review it tomorrow. How does that sound?", "ja": "今夜下書きを送るので、明日確認してください。それでどうですか？"}, {"en": "A: Pizza and a movie tonight? How does that sound?\nB: Sounds perfect!", "ja": "A: 今夜はピザと映画はどう？どうかな？\nB: 最高だね！"}]}, {"p": "I just wanted to say", "ja": "ひと言伝えたくて", "c": "thanks", "t": "stem_that", "u": "+ thank you / sorry / congratulations, or + (that) clause", "ex": [{"en": "I just wanted to say thank you for yesterday.", "ja": "昨日のお礼をひと言伝えたくて。"}, {"en": "I just wanted to say that you did a great job.", "ja": "素晴らしい仕事だったと伝えたかったんです。"}, {"en": "I just wanted to say I'm sorry about the mistake.", "ja": "ミスについて謝りたかったんです。"}, {"en": "I just wanted to say congratulations on your promotion.", "ja": "昇進おめでとうと言いたくて。"}, {"en": "I just wanted to say how much I enjoyed working with you.", "ja": "一緒に働けて本当に楽しかったと伝えたかったんです。"}]}, {"p": "I'm looking forward to", "ja": "〜を楽しみにしています", "c": "feeling", "t": "ing", "u": "+ noun or -ing (never a bare verb)", "ex": [{"en": "I'm looking forward to meeting you next week.", "ja": "来週お会いできるのを楽しみにしています。"}, {"en": "I'm looking forward to hearing from you.", "ja": "ご連絡をお待ちしております。"}, {"en": "I'm looking forward to the summer vacation.", "ja": "夏休みが楽しみです。"}, {"en": "I'm looking forward to working with your team.", "ja": "御社のチームとお仕事できるのを楽しみにしています。"}, {"en": "I'm looking forward to seeing the results of the test.", "ja": "テストの結果を見るのが楽しみです。"}]}, {"p": "I'd rather not", "ja": "できれば〜したくない", "c": "opinion", "t": "stem_vp_self", "u": "+ bare verb, or used alone as a polite refusal", "ex": [{"en": "I'd rather not talk about it right now.", "ja": "今はその話はしたくないな。"}, {"en": "I'd rather not drive at night.", "ja": "できれば夜は運転したくない。"}, {"en": "Thanks, but I'd rather not.", "ja": "ありがとう、でも遠慮しておくよ。"}, {"en": "I'd rather not change the plan at this stage.", "ja": "この段階で計画を変えるのはできれば避けたいです。"}, {"en": "I'd rather not eat too late, so let's have dinner at six.", "ja": "あまり遅くに食べたくないから、6時に夕食にしよう。"}]}, {"p": "I'm pleased with", "ja": "〜に満足しています", "c": "feeling", "t": "ing", "u": "+ noun or how-clause", "ex": [{"en": "I'm pleased with the results of the test.", "ja": "テストの結果に満足しています。"}, {"en": "I'm pleased with how the event turned out.", "ja": "イベントの結果に満足しています。"}   function render() {

  /* ================================================================

  function byId(id) { return allPhrases().filter(function (p) { return p.id === id; })[0]; }
  function usePhrase(p, auto) {
    S.input = p.p; S.selectedId = p.id; S.tab = 'generate'; S.results = []; S.meta = null;
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    if (auto) generate();
  }
  function saveForm() {
    var f = S.form, p = f.p.trim();
    if (!p) { toast('英語フレーズを入力してください'); return; }
    var dup = findPhrase(p);
    if (dup && dup.id !== S.editId) { toast('同じフレーズが既に登録されています'); return; }
    var item = { p: p, ja: f.ja.trim(), c: f.c === 'auto' ? classifyCategory(p) : f.c, t: f.t === 'auto' ? detectType(p) : f.t, src: 'custom' };
    if (S.editId) {
      custom = custom.map(function (x) { return x.id === S.editId ? Object.assign({}, x, item) : x; });
      toast('更新しました');
    } else {
      item.id = uid(); custom.unshift(item);
      toast('「' + CAT[item.c].l + '」に追加しました');
    }
    saveCustom();
    S.showForm = false; S.editId = null; S.form = { p: '', ja: '', c: 'auto', t: 'auto' };
    renderPhrases();
  }
  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a'), id = b.getAttribute('data-id'), idx = +b.getAttribute('data-i');
    switch (a) {
      case 'tab': talkReset(); S.tab = b.getAttribute('data-tab'); render(); window.scrollTo(0, 0); break;
      case 'gen-cat': S.genCat = b.getAttribute('data-cat'); renderGenerate(); break;
      case 'phrase-cat': S.phraseCat = b.getAttribute('data-cat'); renderPhrases(); break;
      case 'fav-cat': S.favCat = b.getAttribute('data-cat'); renderFavorites(); break;
      case 'suggest': suggestPhrases(); break;
      case 'sug-reg': registerSuggestion(idx); break;
      case 'sug-say': if (S.sug && S.sug.list[idx]) speak(S.sug.list[idx].en); break;
      case 'archive':
        var ap = byId(id); if (!ap) break;
        archived[doneKey(ap.p)] = Date.now(); saveArchived();
        if (S.selectedId === ap.id) S.selectedId = null;
        renderPhrases(); toast('📦 マスター！「' + ap.p + '」をアーカイブしました');
        break;
      case 'unarchive':
        var up2 = byId(id); if (!up2) break;
        delete archived[doneKey(up2.p)]; saveArchived();
        renderPhrases(); toast('「' + CAT[up2.c].l + '」に戻しました');
        break;
      case 'pick-random':
        var pool = activePhrases().filter(function (x) { return x.id !== S.selectedId; });
        if (!pool.length) break;
        var rp = pool[Math.floor(Math.random() * pool.length)];
        S.input = rp.p; S.selectedId = rp.id; renderGenerate();
        var box = document.getElementById('pickBox'), sel = box && box.querySelector('[data-id="' + rp.id + '"]');
        if (box && sel) box.scrollTop = Math.max(0, sel.offsetTop - box.clientHeight / 2 + sel.offsetHeight / 2);
        toast('🎲 ' + rp.p);
        break;
      case 'pick': var p = byId(id); if (p) { S.input = p.p; S.selectedId = p.id; renderGenerate(); } break;
      case 'clear-input': S.input = ''; S.selectedId = null; renderGenerate(); var inp = $('#phraseInput'); if (inp) inp.focus(); break;
      case 'tone': S.tone = b.getAttribute('data-tone'); settings.tone = S.tone; saveSettings(); renderGenerate(); break;
      case 'generate': generate(); break;
      case 'quick-add':
        var raw = S.input.trim(); if (!raw) break;
        var item = { id: uid(), p: raw, ja: '', c: classifyCategory(raw), t: detectType(raw), src: 'custom' };
        custom.unshift(item); saveCustom(); S.selectedId = item.id;
        toast('「' + CAT[item.c].l + '」に登録しました'); renderGenerate(); break;
      case 'speak': if (S.results[idx]) speak(S.results[idx].en); break;
      case 'talk':
        var tk = b.getAttribute('data-key');
        if (T.key === tk && T.phase === 'listening') talkFinish(); else talkStart(tk);
        break;
      case 'talk-done': talkFinish(); break;
      case 'talk-cancel': talkReset(); rerenderTalk(); break;

        T.typing = true; T.typed = (T.final + ' ' + T.interim).trim();

        T.listening = false; rerenderTalk();
        setTimeout(function () { var ta = document.querySelector('[data-in="talk-typed"]'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 30);
        break;
      case 'talk-say':
        if (T.result) speak(b.getAttribute('data-text') === 'fix' ? T.result.corrected : T.said);
        break;
      case 'copy-all': copyText(S.results.map(function (r, i) { return (i + 1) + '. ' + r.en + (r.ja && !r.hint ? '\n   ' + r.ja : ''); }).join('\n')); break;
      case 'fav': if (S.results[idx]) { toggleFav(S.results[idx]); var res = $('#results'); if (res) res.innerHTML = resultsHTML(); } break;
      case 'use': var up = byId(id); if (up) usePhrase(up, true); break;

      case 'open-form': S.showForm = true; S.editId = null; S.form = { p: '', ja: '', c: 'auto', t: 'auto' }; renderPhrases(); setTimeout(function () { var i = document.querySelector('[data-in="form-p"]'); if (i) i.focus(); }, 50); break;

      case 'fcopy': var f2 = favs.filter(function (f) { return f.id === id; })[0]; if (f2) copyText(f2.en + (f2.ja ? '\n' + f2.ja : '')); break;
      case 'fdel': if (T.key === 'f:' + id) talkReset(); favs = favs.filter(function (f) { return f.id !== id; }); saveFavs(); renderNav(); renderFavorites(); toast('削除しました'); break;
      case 'toggle-key': S.showKey = !S.showKey; renderSettings(); break;
      case 'test-ai':
        if (!settings.apiKey) { toast('先に API キーを入力してください'); break; }

      case 'sheet-mode': settings.sheetMode = b.getAttribute('data-mode'); saveSettings(); renderSettings(); break;
      case 'sync': syncSheet(); break;

      case 'clear-custom': if (confirm('マイフレーズをすべて削除しますか？')) { custom = []; saveCustom(); renderSettings(); toast('削除しました'); } break;
      case 'clear-sheet': if (confirm('シートから読み込んだフレーズを削除しますか？')) { sheet = []; saveSheet(); renderSettings(); toast('削除しました'); } break;
      case 'clear-done': if (confirm('練習記録（Done）をすべて削除しますか？')) { done = {}; saveDone(); renderSettings(); toast('削除しました'); } break;

  document.addEventListener('input', function (e) {

      var di = $('#detectInfo'); if (di) di.innerHTML = detectInfoHTML();
      var cb = $('#clearBtn'); if (cb) cb.classList.toggle('hidden', !v);
    } else if (k === 'talk-typed') {
      T.typed = v;

      S.idea = v;
    } else if (k.indexOf('form-') === 0) {
      S.form[k.slice(5)] = v;
      if (k === 'form-p') {
        var ac = $('#autoCat'), at = $('#autoType');
        if (ac) ac.innerHTML = '自動判定：<b>' + esc(v.trim() ? CAT[classifyCategory(v)].l : '—') + '</b>';
        if (at) at.innerHTML = '自動判定：<b>' + esc(v.trim() ? TYPES[detectType(v)] : '—') + '</b>';
      }
    } else if (k === 'rate') {
      settings.rate = parseFloat(v); saveSettings(); var rv = $('#rateVal'); if (rv) rv.textContent = settings.rate.toFixed(2);
    } else if (k === 'apiKey' || k === 'model' || k === 'sheetUrl') {
      settings[k] = v.trim(); saveSettings();
    } else if (k === 'engine' || k === 'voice') {
      settings[k] = v; saveSettings();
    }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-in');
    if (k === 'engine' || k === 'voice') { settings[k] = e.target.value; saveSettings(); }
  });
  document.addEventListener('keydown', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-in');
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      if (k === 'input') { e.preventDefault(); e.target.blur(); generate(); }
      else if (k === 'idea') { e.preventDefault(); e.target.blur(); suggestPhrases(); }
      else if (k === 'talk-typed' && !e.shiftKey) { e.preventDefault(); e.target.blur(); talkFinish(); }
      else if (k === 'form-p' || k === 'form-ja') { e.preventDefault(); saveForm(); }
    }
  });

  if ('speechSynthesis' in window) {
    try { speechSynthesis.onvoiceschanged = function () { if (S.tab === 'settings') renderSettings(); }; } catch (e) {}
  }

  $('#logoIcon').innerHTML = icon('sparkles');
  render();

  // テスト用に公開（コンソールで確認可能）
  window.ExpressFlow = { detectType: detectType, classifyCategory: classifyCategory, localGenerate: function (p, t) { return localGenerate(resolvePhrase(p), t || 'standard'); } };
})();
</script>
</body>
</html>
